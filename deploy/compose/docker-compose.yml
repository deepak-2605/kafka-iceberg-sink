# Local dev stack: Kafka (KRaft), S3-compatible object store, Iceberg REST catalog.
# Every service keeps its state in a named volume, so `docker compose restart`
# (or a crash) loses nothing. `make down-clean` wipes the volumes.
#
# Host ports
#   9092  Kafka
#   8333  S3 API (SeaweedFS), credentials admin / password, bucket "warehouse"
#   8181  Iceberg REST catalog

name: kis

services:
  kafka:
    image: apache/kafka:4.0.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Creates the topic once Kafka is healthy. 12 partitions from day one so
  # week 3 needs no topic migration.
  kafka-init:
    image: apache/kafka:4.0.0
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic events --partitions 12 --replication-factor 1
    restart: "no"

  s3:
    image: chrislusf/seaweedfs:3.97
    command: server -dir=/data -ip=s3 -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -volume.max=0 -master.volumeSizeLimitMB=1024
    ports: ["8333:8333"]
    volumes:
      - s3-data:/data
      - ./s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8333/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  s3-init:
    image: chrislusf/seaweedfs:3.97
    depends_on:
      s3: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - echo 's3.bucket.create -name warehouse' | weed shell -master=s3:9333
    restart: "no"

  # The REST fixture backed by SQLite on a volume, so the catalog survives
  # restarts. The in-memory default would lose every table on restart.
  catalog:
    image: apache/iceberg-rest-fixture:1.10.0
    depends_on:
      s3-init: { condition: service_completed_successfully }
    user: root
    ports: ["8181:8181"]
    environment:
      CATALOG_URI: jdbc:sqlite:file:/catalog/catalog.db
      CATALOG_JDBC_USER: user
      CATALOG_JDBC_PASSWORD: password
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://s3:8333
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      # AWS SDK v2 (2.30+) uploads with aws-chunked encoding and trailing
      # checksums by default. SeaweedFS stores the chunk framing as file
      # content, so metadata.json reads back as garbage. Only checksum when
      # the API requires it.
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
    volumes: ["catalog-data:/catalog"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8181/v1/config >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  kafka-data:
  s3-data:
  catalog-data:
